services:
  backend:
    build:
      context: ./backend
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      NODE_ENV: development
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_PROXY_TARGET: http://backend:4000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: npm run dev

volumes:
  backend_node_modules:
  frontend_node_modules:
