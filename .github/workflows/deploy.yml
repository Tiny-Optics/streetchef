name: Deploy to Production

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: ghcr.io/tiny-optics/streetchef-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ghcr.io/tiny-optics/streetchef-frontend:latest
          build-args: |
            VITE_API_URL=
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR,GITHUB_REPOSITORY,CERTBOT_EMAIL
          script: |
            set -e
            WORKDIR="/opt/streetchef"
            REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            DOMAIN="app.streetchef.co.za"
            CERT_PATH="/etc/letsencrypt/live/${DOMAIN}/fullchain.pem"
            echo "Ensuring repo exists on server"

            if [ -d "$WORKDIR/.git" ]; then
              echo "Repo exists"
            elif [ -d "$WORKDIR" ] && [ "$(ls -A "$WORKDIR")" ]; then
              echo "Directory exists but not git repo; backing up and recloning"
              rm -rf "${WORKDIR}.bak" || true
              mv "$WORKDIR" "${WORKDIR}.bak"
              mkdir -p "$WORKDIR"
              git clone --depth 1 "$REPO_URL" "$WORKDIR"
            else
              mkdir -p "$WORKDIR"
              git clone --depth 1 "$REPO_URL" "$WORKDIR"
            fi

            cd "$WORKDIR"
            git pull "$REPO_URL" main

            mkdir -p "$WORKDIR/backend/uploads"

            if [ ! -f "$WORKDIR/backend/.env" ]; then
              if [ -f "${WORKDIR}.bak/backend/.env" ]; then
                mkdir -p "$WORKDIR/backend"
                cp "${WORKDIR}.bak/backend/.env" "$WORKDIR/backend/.env"
              else
                echo "Missing env file: $WORKDIR/backend/.env"
                exit 1
              fi
            fi

            bash ./deploy/update-backend-env.sh "$WORKDIR/backend/.env"

            if ! command -v nginx >/dev/null 2>&1 || ! command -v certbot >/dev/null 2>&1; then
              apt-get update
              apt-get install -y nginx certbot
            fi
            systemctl enable --now certbot.timer || true

            chmod +x ./deploy/nginx/install-streetchef-site.sh
            bash ./deploy/nginx/install-streetchef-site.sh
            nginx -t
            systemctl reload nginx

            if [ ! -f "$CERT_PATH" ]; then
              if [ -z "${CERTBOT_EMAIL:-}" ]; then
                echo "Missing CERTBOT_EMAIL GitHub secret"
                exit 1
              fi

              certbot certonly \
                --webroot \
                -w /var/www/certbot \
                -d "$DOMAIN" \
                --email "$CERTBOT_EMAIL" \
                --agree-tos \
                --non-interactive

              bash ./deploy/nginx/install-streetchef-site.sh
              nginx -t
              systemctl reload nginx
              certbot renew --dry-run
            fi

            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            docker compose -f docker-compose.ghcr.yml down
            docker compose -f docker-compose.ghcr.yml pull
            docker compose -f docker-compose.ghcr.yml up -d

            sleep 10
            docker compose -f docker-compose.ghcr.yml ps

      - name: Deployment Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "Deployment successful"
          else
            echo "Deployment failed"
          fi
