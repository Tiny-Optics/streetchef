services:
  backend:
    image: ghcr.io/tiny-optics/streetchef-backend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - ./backend/.env
    environment:
      PORT: "4000"
      NODE_ENV: production

  frontend:
    image: ghcr.io/tiny-optics/streetchef-frontend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
